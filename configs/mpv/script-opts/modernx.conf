show_on_pause=no
seek_handle_size=0
show_youtube_comments=yes
show_title=false
info_button=true
window_controls=false
window_top_bar=no
seekbarfg_color=#9B59B6
seekbar_cache_color=#FF8C00
# UI scale baseline — modernx.lua multiplies this by the monitor's HiDPI scale
# (display-hidpi-scale), so 1.0 yields 2x on a 4K @ scale-2 monitor and 1x on a
# 1080p @ scale-1 monitor. Raise to enlarge the bar on every monitor.
scale_windowed=1.0
scale_fullscreen=1.0
scale_forced_window=1.0